# Environment for predict_af2rank.py.
#
# Versions recorded from the machine the predictions were run on. Install
# ColabDesign separately so that the pinned tag is explicit:
#
#     conda env create -f environment.yml
#     conda activate af2rank
#     pip install git+https://github.com/sokrypton/ColabDesign.git@v1.1.3
#
# The jaxlib pin is the CUDA 12 / cuDNN 8.9 build, which is not on PyPI, so the
# --find-links line below is required to resolve it. Adjust the build to your
# driver, or drop the local version suffix for the CPU build to inspect the
# code without a GPU.
#
# Installing ColabDesign afterwards can pull its own jax requirement and
# replace that build; see the GPU check in README.md.
name: af2rank
channels:
  - conda-forge
dependencies:
  - python=3.11.8
  - pip
  - pip:
      - --find-links https://storage.googleapis.com/jax-releases/jax_cuda_releases.html
      - jax==0.4.16
      - jaxlib==0.4.16+cuda12.cudnn89
      - dm-haiku==0.0.10
      - chex==0.1.84
      - optax==0.1.7
      - ml-dtypes==0.5.1
      - absl-py==2.0.0
      - numpy==1.26.1
      - scipy==1.11.3
      - biopython
      - py3Dmol
